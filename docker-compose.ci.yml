# CI-only compose override: replaces the external-repo service (ecoagent)
# and Emily (Hermes Agent) with lightweight nginx mock containers so ecoseek-api
# can start and pass healthchecks in GitHub Actions without cloning private
# external repos or building the full hermes-agent Docker image.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --wait

services:
  # ── Emily mock (Hermes Agent API server stub) ──────────────────────────
  # Replaces the real Emily Docker build (which does `pip install
  # git+https://github.com/alrobles/hermes-agent.git` — too slow for CI).
  emily:
    image: nginx:alpine
    container_name: emily
    ports:
      - "127.0.0.1:${EMILY_PORT:-8642}:8642"
    volumes:
      - ./docker/ci/emily-mock.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8642/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks:
      - ecoseek-net

  # ── EcoAgent mock ──────────────────────────────────────────────────────
  ecoagent:
    image: nginx:alpine
    container_name: ecoagent
    # Base compose runs `python -m ecoagent.tool_server`; override it so the
    # nginx mock image runs its own default entrypoint instead of crash-looping.
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "127.0.0.1:${ECOAGENT_PORT:-8000}:8000"
    volumes:
      - ./docker/ci/ecoagent-mock.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/v1/tools"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks:
      - ecoseek-net
